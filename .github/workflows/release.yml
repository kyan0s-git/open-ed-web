# Cut a release: push a tag that matches package.json's version.
#
#   npm version 0.2.0 --no-git-tag-version   # bump package.json (and the lockfile)
#   git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# The workflow builds the web app, the self-hosted server, desktop installers for
# Windows, macOS (Apple Silicon and Intel) and Linux, attaches them to a GitHub Release, and publishes the release once everything succeeded. It can also
# be started by hand from the Actions tab for an existing tag.
#
# Optional configuration (Settings → Secrets and variables → Actions):
#   variable SYNC_SERVER_URL   default sync server baked into the desktop app
#   variable TAURI_UPDATER_PUBKEY, secrets TAURI_SIGNING_PRIVATE_KEY and
#            TAURI_SIGNING_PRIVATE_KEY_PASSWORD     automatic updates (docs/desktop.md)
#   secrets  APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID       macOS signing + notarization
#   Without them the macOS app is ad-hoc signed and the Windows installer is unsigned;
#   both run, after the user confirms a warning on first launch. See docs/desktop.md.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or reuse the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "open-ed-web $TAG" --generate-notes
          fi
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  web:
    name: Web app and server
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:server

      - name: Package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p out
          (cd dist && zip -qr "../out/open-ed-web-$VERSION-web.zip" .)
          mkdir -p "pkg/open-ed-web-$VERSION-server"
          cp -r dist server-dist "pkg/open-ed-web-$VERSION-server/"
          cp docs/self-hosting.md "pkg/open-ed-web-$VERSION-server/README.md"
          tar -czf "out/open-ed-web-$VERSION-server.tar.gz" -C pkg "open-ed-web-$VERSION-server"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust_target: ""
          - name: Windows
            os: windows-latest
            args: ""
            rust_target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Signing is used only when its secrets exist. Exporting empty values would make
      # the bundler try, and fail, to sign with nothing.
      - name: Signing credentials (if configured)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!name}" ]; then echo "$name=${!name}" >> "$GITHUB_ENV"; fi
            done
          fi

      # Automatic updates, when the repository has an update key. The app checks this
      # repository's latest release for latest.json, and only installs builds signed
      # with the matching private key. Without a key, builds simply ship without updates.
      - name: Updater configuration (if configured)
        id: updater
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$PUBKEY" ] && [ -n "$PRIVATE_KEY" ]; then
            node -e '
              const [pubkey, repo] = process.argv.slice(1);
              const config = {
                bundle: { createUpdaterArtifacts: true },
                plugins: { updater: { pubkey, endpoints: [`https://github.com/${repo}/releases/latest/download/latest.json`] } },
              };
              require("fs").writeFileSync("src-tauri/tauri.updater.conf.json", JSON.stringify(config));
            ' "$PUBKEY" "$GITHUB_REPOSITORY"
            {
              echo "TAURI_SIGNING_PRIVATE_KEY=$PRIVATE_KEY"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PRIVATE_KEY_PASSWORD"
              echo "VITE_UPDATES=1"
            } >> "$GITHUB_ENV"
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VITE_SYNC_SERVER: ${{ vars.SYNC_SERVER_URL }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

  publish:
    name: Publish release
    needs: [prepare, web, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest
