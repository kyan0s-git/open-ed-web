[package]
name = "open-ed-web"
version = "0.1.0"
description = "Study MIT OpenCourseWare courses offline, with mastery tracking."
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix keeps the library name distinct from the binary on Windows.
name = "open_ed_web_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
percent-encoding = "2"

[profile.release]
# Smaller binaries; the app is a webview around static files, not hot Rust code.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
